<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静息 · Still — 焦虑互动实验(p5.js)</title>
<!-- p5.js 官方 CDN;如需离线可下载到本地并替换 src -->
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #E9E5DF; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }

  /* ---------- 覆盖层(开始 / 结算),莫兰迪纸面风格 ---------- */
  #overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(233, 229, 223, 0.72);
    backdrop-filter: blur(4px);
    transition: opacity .5s ease;
    z-index: 10;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .card {
    background: rgba(248, 246, 242, 0.94);
    border: 1px solid rgba(59, 58, 54, 0.18);
    border-radius: 14px;
    padding: 34px 44px;
    max-width: 520px;
    text-align: center;
    color: #5B5852;
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    box-shadow: 0 18px 60px rgba(59,58,54,.14);
  }
  .card h1 { font-size: 34px; font-weight: 600; letter-spacing: 10px; color: #3B3A36; }
  .card h1 .en { display: block; font-size: 13px; letter-spacing: 6px; color: #9A948B; margin-top: 6px; font-family: Georgia, serif; }
  .card .rule {
    margin: 18px 0 4px; font-size: 14px; line-height: 2.0; text-align: left;
  }
  .card .rule b { color: #B5654F; }
  .card .rule i { font-style: normal; color: #7C93A6; }
  .card .quote { margin: 14px 0 4px; font-size: 16px; color: #8A8272; letter-spacing: 1px; }
  .card .stats { font-size: 13px; color: #9A948B; margin: 8px 0; line-height: 1.9; }
  .card .stats b { color: #5B5852; font-size: 15px; }
  .card .badge {
    display: inline-block; margin: 10px 0 2px;
    font-size: 20px; letter-spacing: 6px; color: #6B8299;
    border: 1px solid rgba(107,130,153,.4); border-radius: 999px;
    padding: 8px 26px;
  }
  .card button {
    margin-top: 18px;
    background: #3B3A36; color: #E9E5DF;
    border: none; border-radius: 999px;
    padding: 10px 44px;
    font-size: 15px; letter-spacing: 8px; text-indent: 8px;
    font-family: "Songti SC", "Noto Serif SC", serif;
    cursor: pointer;
  }
  .card button:hover { background: #55534D; }
  .card .hint { margin-top: 12px; font-size: 11px; color: #B0AAA0; }
</style>
</head>
<body>

<!-- 开始 / 结算覆盖层:内容由 JS 填充 -->
<div id="overlay"><div class="card" id="ovCard"></div></div>

<script>
/* =====================================================================
   静息 · Still — 焦虑主题互动实验(p5.js 版)
   ---------------------------------------------------------------------
   玩法:按住鼠标拖拽红点,抵抗四方正弦波形的拉力,
        让它留在周期性"呼吸"的黑色安全圈内。
   机制:压力条(圈内↓ 圈外↑,满格触发"短暂崩溃")、
        深呼吸(长按空格,拉力减半 + 水波纹,冷却 5s)、
        正念粒子(触碰加分)、心流 Flow(贴近圆心时分数倍增)。
   ===================================================================== */

/* ---------- 莫兰迪色板 ---------- */
const P = {
  paper : "#E9E5DF",   // 灰米纸面
  ink   : "#3B3A36",   // 安全圈·炭黑
  wave  : "#7C93A6",   // 灰蓝波形
  waveD : "#64798C",
  dot   : "#B5654F",   // 玩家红点·豆沙红
  spiral: "#9A948B",   // 螺旋·暖灰
  sage  : "#A3B39A",   // 雾绿(治愈/粒子)
  rose  : "#C9A9A0",   // 灰粉(警示柔化)
  gold  : "#C2A878",   // 分数
  text  : "#5B5852",
};

/* ---------- 全局状态 ---------- */
let state = "menu";          // menu | play | over
let T = 0;                   // 游戏运行时钟(秒)
let surviveT = 0;            // 本次坚持时间
let score = 0;
let stress = 0.15;           // 压力值 0..1(心率条)
let breakdowns = 0;          // 已触发"短暂崩溃"次数(3 次结束)
let bd = { t: 0 };           // 崩溃演出计时
let shake = 0;               // 震屏强度

let dot;                     // 玩家红点 {x,y,vx,vy}
let waves = [];              // 四方波形
let spirals = [];            // 环绕红点的螺旋
let particles = [];          // 正念粒子
let ripples = [];            // 水波纹
let grain;                   // 纸面颗粒离屏图层

let breath = { active: false, t: 0, cd: 0, rip: 0, mult: 1 };
let flowHeat = 0;            // 心流蓄能(贴近圆心时增长)
let flowOn = false;
let dangerLvl = 0;           // 本帧"紧绷度"(0..1),由压力值推导,供各绘制函数共用

/* ---------- 可调参数 ---------- */
const PULL   = 340;   // 波形拉力系数
const DRAG_K = 16;    // 指针橡皮筋刚度
const DRAG_CAP = 3200;
const DAMP   = 2.4;   // 阻尼
const BD_MAX = 3;     // 崩溃次数上限 = 游戏结束

/* ---------- 工具 ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand  = (a, b) => a + Math.random() * (b - a);
function hexRGB(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
const RGB = {}; for (const k in P) RGB[k] = hexRGB(P[k]);
function mixC(k1, k2, t) {
  const a = RGB[k1], b = RGB[k2];
  return color(a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t);
}

/* 安全区半径:基准值 × 呼吸系数(周期性呼吸缩放) */
function baseR()   { return clamp(min(width, height) * 0.21, 110, 200); }
function safeR()   { return baseR() * (1 + 0.055 * Math.sin(T * 0.9)); }
function center()  { return { x: width / 2, y: height / 2 }; }

/* ================= p5 生命周期 ================= */
function setup() {
  createCanvas(windowWidth, windowHeight);
  makeGrain();
  resetEntities();
  showMenu();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  makeGrain();
}

/* 纸面颗粒:一次性画在离屏图层,每帧低透明度叠加 */
function makeGrain() {
  grain = createGraphics(width, height);
  grain.noStroke();
  for (let i = 0; i < width * height / 900; i++) {
    grain.fill(59, 58, 54, rand(4, 14));
    grain.circle(random(width), random(height), rand(0.6, 1.6));
  }
}

function resetEntities() {
  dot = { x: width / 2, y: height / 2, vx: 0, vy: 0 };
  waves = ["top", "bottom", "left", "right"].map(side => ({
    side, ph: rand(0, TWO_PI), freq: rand(0.018, 0.028),
    spd: rand(1.6, 2.6), amp: 0.4, surge: 0, next: rand(1.2, 3),
  }));
  spirals = [
    { r: 0.60, turns: 3.0, dir:  1, spd: 1.00, ph: rand(0, TWO_PI), rot: rand(0, TWO_PI), jit: 0 },
    { r: 0.45, turns: 2.2, dir: -1, spd: 1.40, ph: rand(0, TWO_PI), rot: rand(0, TWO_PI), jit: 0 },
    { r: 0.76, turns: 3.8, dir: -1, spd: 0.70, ph: rand(0, TWO_PI), rot: rand(0, TWO_PI), jit: 0 },
  ];
  particles = [];
  for (let i = 0; i < 6; i++) particles.push(newParticle());
  ripples = [];
}
function newParticle() {
  return {
    x: rand(60, width - 60), y: rand(60, height - 60),
    vx: rand(-14, 14), vy: rand(-14, 14),
    ph: rand(0, TWO_PI), tone: random() < 0.5 ? "sage" : "rose",
  };
}

function keyPressed() {
  if (key === " ") {
    keyPressed.preventDefault?.();
    if (state === "play" && !breath.active && breath.cd <= 0) {
      breath.active = true; breath.t = 0; breath.rip = 0;
      spawnRipple(width/2, height/2, 0.55, baseR() * 0.3);
    }
    return false; // 阻止空格滚动页面
  }
  // 调试钩子(仅 ?debug):K 直接把压力拉满,便于验证崩溃与结算流程
  if (location.search.includes("debug") && (key === "k" || key === "K")) {
    stress = 1;
  }
}
function keyReleased() {
  if (key === " " && breath.active) {
    breath.active = false;
    breath.cd = 5;      // 松手即进入 5 秒冷却
  }
}

/* 鼠标 / 触摸:按住画布任意位置,红点被橡皮筋拉向指针 */
let ptr = { x: 0, y: 0, down: false };
function mousePressed() { ptr.down = true; ptr.x = mouseX; ptr.y = mouseY; }
function mouseDragged() { ptr.x = mouseX; ptr.y = mouseY; }
function mouseReleased(){ ptr.down = false; }
function touchStarted(){ ptr.down = true; ptr.x = touches[0]?.x ?? mouseX; ptr.y = touches[0]?.y ?? mouseY; return false; }
function touchMoved()  { ptr.x = touches[0]?.x ?? mouseX; ptr.y = touches[0]?.y ?? mouseY; return false; }
function touchEnded()  { ptr.down = false; return false; }

/* ================= 主更新 ================= */
function update(dt) {
  T += dt;
  surviveT += dt;

  /* --- 深呼吸状态机:激活期 3s,结束(松手/到时)后冷却 5s --- */
  if (breath.active) {
    breath.t += dt;
    breath.rip -= dt;
    if (breath.rip <= 0) {
      spawnRipple(width/2, height/2, 0.4, baseR() * 0.35);
      breath.rip = 0.55;
    }
    if (breath.t >= 3) { breath.active = false; breath.cd = 5; } // 满 3 秒自动结束
  } else {
    breath.cd = Math.max(0, breath.cd - dt);
  }
  // 拉力倍率:激活时缓缓压到 0.5,结束后缓缓回到 1
  const mTgt = breath.active ? 0.5 : 1;
  breath.mult += (mTgt - breath.mult) * (1 - Math.exp(-3 * dt));

  /* --- 波形振幅:基础正弦 + 随机涌动 --- */
  for (const w of waves) {
    w.surge *= Math.exp(-dt * 1.1);
    w.next -= dt;
    if (w.next <= 0) { w.surge += rand(0.5, 1.2); w.next = rand(1.4, 3.2); }
    w.amp = clamp(0.45 + 0.30 * Math.sin(T * w.spd + w.ph) + w.surge, 0.08, 2.1);
  }

  /* --- 力场合成:四方拉力(×呼吸倍率) + 焦虑气流 + 指针橡皮筋 --- */
  let fx = 0, fy = 0;
  const gustA = T * 0.12 + Math.sin(T * 0.07) * 2;
  const gustM = (0.40 + 0.22 * Math.sin(T * 0.1 + 1)) * PULL;
  fx += Math.cos(gustA) * gustM;
  fy += Math.sin(gustA) * gustM;

  for (const w of waves) {
    const a = anchorOf(w);
    const dx = a.x - dot.x, dy = a.y - dot.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = PULL * breath.mult * w.amp;
    fx += dx / d * f;
    fy += dy / d * f;
  }
  if (ptr.down && bd.t <= 0) {   // 崩溃期间短暂失控
    let ax = (ptr.x - dot.x) * DRAG_K, ay = (ptr.y - dot.y) * DRAG_K;
    const m = Math.hypot(ax, ay);
    if (m > DRAG_CAP) { ax *= DRAG_CAP / m; ay *= DRAG_CAP / m; }
    fx += ax; fy += ay;
  }
  dot.vx = (dot.vx + fx * dt) * Math.exp(-DAMP * dt);
  dot.vy = (dot.vy + fy * dt) * Math.exp(-DAMP * dt);
  dot.x += dot.vx * dt;
  dot.y += dot.vy * dt;

  /* --- 画布边界轻反弹 --- */
  if (dot.x < 10)     { dot.x = 10;     dot.vx *= -0.4; }
  if (dot.x > width-10)  { dot.x = width-10;  dot.vx *= -0.4; }
  if (dot.y < 10)     { dot.y = 10;     dot.vy *= -0.4; }
  if (dot.y > height-10) { dot.y = height-10; dot.vy *= -0.4; }

  /* --- 圈内/圈外 → 压力值变化 --- */
  const c = center(), R = safeR();
  const dist = Math.hypot(dot.x - c.x, dot.y - c.y);
  const inside = dist <= R;

  /* --- 心流 Flow:高精度贴合圆心(距圆心 < R×0.14) --- */
  if (inside && dist < R * 0.14) flowHeat += dt;
  else flowHeat = Math.max(0, flowHeat - dt * 2);
  const wasFlow = flowOn;
  flowOn = flowHeat > 1;
  if (flowOn && !wasFlow) spawnRipple(dot.x, dot.y, 0.5, 20); // 进入心流的一圈涟漪

  /* --- 压力值:圈内缓降(心流更快),圈外快升 --- */
  if (inside) stress -= (flowOn ? 0.09 : 0.05) * dt;
  else        stress += 0.13 * dt;
  stress = clamp(stress, 0, 1);

  /* --- 压力满格 → 短暂崩溃 --- */
  if (stress >= 1 && bd.t <= 0) {
    breakdowns++;
    bd.t = 2.4;                // 演出时长
    shake = 1;
    score = Math.round(score * 0.6);   // 重置部分积分
    stress = 0.42;                     // 崩溃后压力回落但不归零
    spawnRipple(c.x, c.y, 0.6, R * 0.4);
    if (breakdowns >= BD_MAX) { setTimeout(() => gameOver(), 1400); } // 演出结束后结算
  }
  bd.t = Math.max(0, bd.t - dt);
  shake *= Math.exp(-3 * dt);

  /* --- 计分:圈内 +10/s,心流 ×3;正念粒子 +25 --- */
  if (inside) score += (flowOn ? 30 : 10) * dt;

  /* --- 正念粒子:漂移、触碰收集 --- */
  for (const p of particles) {
    p.vx += Math.sin(T * 0.7 + p.ph) * 6 * dt;
    p.vy += Math.cos(T * 0.6 + p.ph * 2) * 6 * dt;
    p.vx = clamp(p.vx, -22, 22); p.vy = clamp(p.vy, -22, 22);
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x < 40 || p.x > width - 40) p.vx *= -1;
    if (p.y < 40 || p.y > height - 40) p.vy *= -1;
    if (Math.hypot(p.x - dot.x, p.y - dot.y) < 18) {
      score += 25;
      spawnRipple(p.x, p.y, 0.5, 8);
      Object.assign(p, newParticle());
    }
  }

  /* --- 水波纹扩散与消退 --- */
  for (const rp of ripples) { rp.r += rp.v * dt; rp.v *= 1.02; rp.a -= 0.30 * dt; }
  while (ripples.length && ripples[0].a <= 0) ripples.shift();

  /* --- 螺旋:偏离中心/压力越大 → 转速越高、抖动越强;心流时趋于平稳透明 --- */
  const dev = clamp(dist / R, 0, 2);
  const calm = flowOn ? 0.15 : 1;   // 心流时螺旋"静下来"
  for (const s of spirals) {
    s.rot += (0.4 + 3.0 * dev * dev + 3.5 * stress) * s.dir * s.spd * calm * dt;
    s.jit = (Math.sin(T * 15 + s.ph * 9) + Math.sin(T * 27 + s.ph * 5)) * 0.5
          * (0.03 + 0.2 * dev + 0.28 * stress) * (flowOn ? 0.25 : 1);
  }
}

function spawnRipple(x, y, a, r0) {
  ripples.push({ x, y, r: r0 || 12, v: 230, a });
  if (ripples.length > 16) ripples.shift();
}

function anchorOf(w) {
  const m = 32;
  switch (w.side) {
    case "top":    return { x: width / 2, y: m };
    case "bottom": return { x: width / 2, y: height - m };
    case "left":   return { x: m, y: height / 2 };
    case "right":  return { x: width - m, y: height / 2 };
  }
}

/* ================= 绘制 ================= */
function draw() {
  const dt = clamp(deltaTime / 1000, 0, 0.05);
  if (state === "play") update(dt);

  const c = center(), R = safeR();
  const dist = Math.hypot(dot.x - c.x, dot.y - c.y);
  const inside = dist <= R;
  const dev = clamp(dist / R, 0, 2);
  const danger = clamp(stress * 1.4 - 0.25, 0, 1);   // 压力越高画面越"紧"
  dangerLvl = danger;

  background(mixC("paper", "rose", danger * 0.28));
  push();
  if (shake > 0.01) translate(rand(-1,1) * shake * 10, rand(-1,1) * shake * 10);

  /* 纸面颗粒 */
  push();
  tint(255, 60);
  image(grain, 0, 0);
  pop();

  /* 安全圈:呼吸缩放;心流时内部泛起淡雾绿的"湖面" */
  noStroke();
  fill(mixC("sage", "paper", 0.35) + "");
  drawingContext.globalAlpha = lerp(0.05, 0.22, flowHeat) * (inside ? 1 : 0.4);
  circle(c.x, c.y, R * 2);
  drawingContext.globalAlpha = 1;
  noFill();
  stroke(mixC("ink", "rose", danger));
  strokeWeight(2.2);
  circle(c.x, c.y, R * 2);

  /* 四方波形(拉力减半时波线变淡) */
  for (const w of waves) drawWave(w, breath.mult);

  /* 虚线拉力线:透明度随振幅(力)变化 */
  for (const w of waves) drawPullLine(w);

  /* 正念粒子(发光) */
  drawParticles();

  /* 水波纹 */
  noFill();
  for (const rp of ripples) {
    stroke(mixC("sage", "wave", 0.3));
    drawingContext.globalAlpha = Math.max(0, rp.a);
    strokeWeight(2);
    circle(rp.x, rp.y, rp.r * 2);
  }
  drawingContext.globalAlpha = 1;

  /* 螺旋(围绕红点;心流时透明平稳) */
  for (const s of spirals) drawSpiral(s, R, flowOn, dev);

  /* 心流光环 */
  if (flowOn) {
    noFill();
    stroke(P.sage + "");
    drawingContext.globalAlpha = 0.5 + 0.2 * Math.sin(T * 3);
    strokeWeight(1.5);
    circle(dot.x, dot.y, 34 + 4 * Math.sin(T * 2.4));
    circle(dot.x, dot.y, 52 + 6 * Math.sin(T * 1.7));
    drawingContext.globalAlpha = 1;
  }

  /* 红点 */
  noStroke();
  fill(mixC("dot", "rose", danger * 0.5));
  circle(dot.x, dot.y, 14);
  noFill();
  stroke(248, 246, 242, 220);
  strokeWeight(1.5);
  circle(dot.x, dot.y, 15);

  /* HUD:压力条 + 分数 + 呼吸冷却 */
  drawHUD(inside);

  /* 崩溃演出:画面压暗 + 提示词 */
  if (bd.t > 0) {
    const a = clamp(bd.t / 2.4, 0, 1);
    noStroke();
    fill(59, 58, 54, 150 * a);
    rect(-20, -20, width + 40, height + 40);
    fill(233, 229, 223, 230 * a);
    textAlign(CENTER, CENTER);
    textSize(30);
    textFont("Songti SC, Noto Serif SC, serif");
    text("崩  溃", width / 2, height / 2 - 8);
    textSize(13);
    text("休息一下,把注意力带回来", width / 2, height / 2 + 26);
  }
  pop();
}

/* 单侧正弦波:中线在画布边缘,位移即"振幅"的可视化 */
function drawWave(w, m) {
  const a = anchorOf(w);
  const horiz = (w.side === "top" || w.side === "bottom");
  const L = (horiz ? width : height) * 0.5;
  noFill();
  stroke(mixC("wave", "waveD", w.amp / 2.1));
  drawingContext.globalAlpha = lerp(0.9, 0.45, 1 - m);
  strokeWeight(2);
  beginShape();
  for (let u = 0; u <= 1.001; u += 1 / 110) {
    const env = Math.sin(u * PI);
    const off = Math.sin(u * L * w.freq + T * w.spd + w.ph) * w.amp * 13 * env;
    const x = horiz ? a.x - L / 2 + u * L : a.x + off;
    const y = horiz ? a.y + off : a.y - L / 2 + u * L;
    vertex(x, y);
  }
  endShape();
  drawingContext.globalAlpha = 1;
  noStroke();
  fill(mixC("wave", "waveD", w.amp / 2.1));
  circle(a.x, a.y, 7);
}

/* 红点到波形锚点的虚线:越用力越明显 */
function drawPullLine(w) {
  const a = anchorOf(w);
  drawingContext.setLineDash([6, 7]);
  stroke(mixC("wave", "rose", dangerLvl * 0.6));
  drawingContext.globalAlpha = 0.14 + 0.5 * clamp(w.amp / 1.6, 0, 1);
  strokeWeight(1.2);
  line(dot.x, dot.y, a.x, a.y);
  drawingContext.setLineDash([]);
  drawingContext.globalAlpha = 1;
}

/* 正念粒子:柔光小点(雾绿 / 灰粉) */
function drawParticles() {
  for (const p of particles) {
    const pulse = 1 + 0.25 * Math.sin(T * 2.2 + p.ph);
    const col = p.tone === "sage" ? P.sage : P.rose;
    drawingContext.shadowBlur = 14;
    drawingContext.shadowColor = col;
    noStroke();
    fill(col);
    circle(p.x, p.y, 5.5 * pulse);
    drawingContext.shadowBlur = 0;
    fill(248, 246, 242, 200);
    circle(p.x, p.y, 2.2);
  }
}

/* 螺旋线:阿基米德螺线,围绕红点 */
function drawSpiral(s, R, flowOn, dev) {
  const T2 = s.turns * TWO_PI;
  const rMax = R * s.r;
  noFill();
  stroke(P.spiral);
  drawingContext.globalAlpha = (flowOn ? 0.10 : 0.38) + 0.2 * clamp(dev - 1, 0, 1);
  strokeWeight(1.4);
  beginShape();
  const N = 90;
  for (let k = 0; k <= N; k++) {
    const t = (k / N) * T2;
    const r = 5 + (rMax - 5) * (k / N);
    const a = t * s.dir + s.rot + s.jit * Math.sin(k * 0.6);
    vertex(dot.x + Math.cos(a) * r, dot.y + Math.sin(a) * r * 0.96);
  }
  endShape();
  drawingContext.globalAlpha = 1;
}

/* HUD:心率压力条(顶部) / 分数(右上) / 深呼吸冷却(右下) */
function drawHUD(inside) {
  /* 心率条:底部深色轨道 + 填充色随压力从雾绿过渡到灰红,心率越快脉动越快 */
  const bw = Math.min(width * 0.42, 460), bx = width / 2 - bw / 2, by = 22;
  const beat = 1 + 0.18 * Math.sin(T * (1.2 + stress * 5) * TWO_PI);
  noStroke();
  fill(59, 58, 54, 40);
  rect(bx - 2, by - 2, bw + 4, 10, 5);
  fill(mixC("sage", "rose", stress));
  rect(bx, by, bw * stress, 6 * beat + (6 - 6) * 0, 3);
  fill(P.text);
  textAlign(RIGHT, CENTER);
  textSize(12);
  textFont("Songti SC, Noto Serif SC, serif");
  text("心 律", bx - 14, by + 3);
  textAlign(LEFT, CENTER);
  text(Math.round(stress * 100), bx + bw + 12, by + 3);
  if (stress > 0.75) {   // 高压警示:呼吸提示
    fill(mixC("rose", "dot", 0.4));
    text("长按空格 · 深呼吸", bx + bw + 52, by + 3);
  }

  /* 分数(右上)与坚持时间(左上) */
  textAlign(RIGHT, TOP);
  fill(P.text);
  textSize(20);
  text(Math.floor(score), width - 26, 18);
  textSize(11);
  fill(154, 148, 139);
  if (flowOn) { fill(P.sage); text("心流 ×3", width - 26, 46); }
  text("坚持 " + Math.floor(surviveT) + " s", 24, 18);
  textAlign(LEFT, TOP);

  /* 深呼吸冷却指示(右下小圆) */
  const bx2 = width - 52, by2 = height - 52;
  noFill();
  stroke(59, 58, 54, 60);
  strokeWeight(4);
  circle(bx2, by2, 44);
  if (breath.cd > 0) {
    stroke(P.sage);
    arc(bx2, by2, 44, 44, -HALF_PI, -HALF_PI + (1 - breath.cd / 5) * TWO_PI);
  } else if (breath.active) {
    stroke(P.sage);
    arc(bx2, by2, 44, 44, -HALF_PI, -HALF_PI + (breath.t / 3) * TWO_PI);
  }
  noStroke();
  fill(P.text);
  textAlign(CENTER, CENTER);
  textSize(10);
  text(breath.active ? "呼吸中" : (breath.cd > 0 ? breath.cd.toFixed(1) : "空格"), bx2, by2);
  textAlign(LEFT, TOP);
}

/* ================= 流程控制 ================= */
const ov = document.getElementById("overlay");
const ovCard = document.getElementById("ovCard");

function showMenu() {
  state = "menu";
  ovCard.innerHTML = `
    <h1>静 息<span class="en">STILL · A CALMING EXPERIMENT</span></h1>
    <div class="rule">
      <i>按住画布拖拽</i> 红点,抵抗四方波形的拉力,让它留在呼吸的安全圈内。<br>
      <i>心率条</i> 在圈内缓慢下降、出圈快速上升 —— 满格会 <b>短暂崩溃</b>(积分受损),<br>
      三次崩溃后,这场练习就会结束。<br>
      <i>长按空格</i> 深呼吸:3 秒内拉力减半,扩散治愈水波纹(冷却 5 秒)。<br>
      触碰漂浮的 <i>正念粒子</i> 加分;贴住圆心进入 <b>心流</b>,分数三倍。
    </div>
    <button id="ovGo">入 静</button>
    <div class="hint">建议使用键盘与鼠标 · p5.js · 莫兰迪色系</div>`;
  ov.classList.remove("hidden");
  document.getElementById("ovGo").addEventListener("click", startGame);
}

function startGame() {
  score = 0; stress = 0.15; surviveT = 0; T = 0;
  breakdowns = 0; bd.t = 0; flowHeat = 0; flowOn = false;
  breath = { active: false, t: 0, cd: 0, rip: 0, mult: 1 };
  resetEntities();
  state = "play";
  ov.classList.add("hidden");
}

function gameOver() {
  state = "over";
  /* 心理形态徽章:按得分与平静表现评语 */
  let badge, line;
  if (score >= 1500)      { badge = "静 水 深 流"; line = "你与焦虑握手言和,像湖底一样安稳。"; }
  else if (score >= 800)  { badge = "心 湖 微 澜"; line = "微澜起伏,而你始终稳住船桨。"; }
  else if (score >= 300)  { badge = "心 浮 气 躁"; line = "风浪常在 —— 下一次,会更稳。"; }
  else                    { badge = "风 中 之 烛"; line = "觉知到波动本身,已经是一种进步。"; }
  ovCard.innerHTML = `
    <h1>练 习 结 束<span class="en">SESSION COMPLETE</span></h1>
    <div class="badge">${badge}</div>
    <p class="quote">${line}</p>
    <div class="stats">
      坚持时间 <b>${Math.floor(surviveT)} s</b> · 最终得分 <b>${Math.floor(score)}</b><br>
      崩溃 ${breakdowns} 次 · 心流蓄能 ${flowHeat.toFixed(1)}
    </div>
    <button id="ovRe">重 新 开 始</button>
    <div class="hint">深呼吸不是逃避,是把自己轻轻带回中心。</div>`;
  ov.classList.remove("hidden");
  document.getElementById("ovRe").addEventListener("click", startGame);
}
